[project]
name = "split-flows"
version = "0.1.0"
description = "Split-flows"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "egnn-pytorch==0.2.8",
    "hydrantic==0.0.2",
    "mdtraj>=1.10.3",
    "moleculekit>=1.11.1",
    "openmm>=8.4.0.post2",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.14.10",
    "scienceplots>=2.2.0",
    "scikit-learn>=1.7.2",
    "torchdiffeq==0.2.5",
    "tqdm>=4.67.1",
]

[tool.uv.sources]
hydrantic = { git = "https://github.com/hummerichsander/hydrantic.git" }

[dependency-groups]
dev = [
    "genbadge[coverage]",
]

[tool.ruff]
exclude = [
    "tests",
    ".venv",
    "__pycache__",
    "*.egg-info",
]
